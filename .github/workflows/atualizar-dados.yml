name: Atualizar dados do El Niño

on:
  schedule:
    - cron: "0 13 * * *"   # todo dia às 10h (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar dados da NOAA
        run: python scripts/update_enso.py
      - name: Salvar se houver novidade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/enso.json
          git diff --staged --quiet || (git commit -m "Atualiza dados do El Niño" && git push)
